name: tests
on:
  pull_request:
  push:
    branches: [main]
env:
  BLENDER_VERSION: 5.0.1
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # libegl/mesa: Blender Workbench renders through software OpenGL without a GPU.
      - run: >
          sudo apt-get update && sudo apt-get install -y ffmpeg
          libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libxi6 libxxf86vm1
          libxfixes3 libxrender1 libxkbcommon0 libsm6
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ -C ~/blender
      - run: echo "WIBECODE_BLENDER=$HOME/blender/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
